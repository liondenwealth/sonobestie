name: Refresh sonographer jobs

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Crawl employers' public career sites
        run: python3 crawl.py
      - name: Publish jobs.json
        run: |
          git config user.name "sono-bestie-jobs-bot"
          git config user.email "sonobestie@gmail.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "Refresh jobs $(date -u +%F\ %H:%M)"
          git push
